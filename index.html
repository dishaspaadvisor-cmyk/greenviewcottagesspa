document.addEventListener('click', function (event) {
  if (
    event.defaultPrevented ||
    event.button !== 0 ||
    event.metaKey ||
    event.ctrlKey ||
    event.shiftKey ||
    event.altKey
  ) {
    return;
  }

  var target = event.target;
  var link = target instanceof Element ? target.closest('a[href]') : null;
  if (!link || link.hasAttribute('download')) return;

  var protocol = link.protocol.toLowerCase();
  var isLeadAction =
    protocol === 'tel:' ||
    protocol === 'mailto:' ||
    link.hostname.toLowerCase() === 'wa.me' ||
    link.hostname.toLowerCase() === 'api.whatsapp.com';

  if (!isLeadAction) return;

  if (link.target.toLowerCase() === '_blank') {
    gtag_report_conversion();
    return;
  }

  event.preventDefault();
  gtag_report_conversion(link.href);
});
